spring:
  datasource:
    url: jdbc:h2:mem:taskflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        show_sql: false
  flyway:
    enabled: false # H2 auto-creates tables via JPA update for fast local dev without postgres

logging:
  level:
    com.taskflow: DEBUG
    org.springframework.security: INFO
