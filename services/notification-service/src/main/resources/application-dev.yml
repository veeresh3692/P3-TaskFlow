spring:
  datasource:
    url: jdbc:h2:mem:taskflow_notifications_dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    listener:
      auto-startup: false # Disabled auto-startup in dev without Kafka broker

taskflow:
  kafka:
    enabled: false
