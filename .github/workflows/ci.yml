name: TASKFLOW CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  backend-test-and-package:
    name: Backend Multi-Module Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Run Backend Tests (Monolith & Microservices)
        run: |
          mvn clean test --batch-mode

      - name: Package Backend JAR Artifacts
        run: |
          mvn package -DskipTests --batch-mode

      - name: Upload Backend Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-backend-jars
          path: |
            backend/target/*.jar
            services/*/target/*.jar

  frontend-test-and-build:
    name: Frontend Lint, Test & Production Build (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm test

      - name: Build Frontend Distribution Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Upload Frontend Build Assets
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-frontend-dist
          path: frontend/dist/

  docker-compose-validate:
    name: Docker Compose Syntax & Configuration Verification
    runs-on: ubuntu-latest
    needs: [backend-test-and-package, frontend-test-and-build]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Docker Compose Configuration (Microservices)
        run: |
          docker compose config

      - name: Verify Docker Compose Configuration (Monolith)
        run: |
          docker compose -f docker-compose.monolith.yml config
